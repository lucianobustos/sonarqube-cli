# Required metadata for SonarCloud
sonar.projectKey=lucianobustos_sonarqube-cli
sonar.organization=lucianobustos
sonar.host.url=https://sonarcloud.io

# Since the entire repo is Bash scripts at root:
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Optional links (helps navigate from Sonar UI)
sonar.links.homepage=https://github.com/lucianobustos/sonarqube-cli
sonar.links.scm=https://github.com/lucianobustos/sonarqube-cli.git

# Optional exclusions (if you have files that should not be scanned)
# sonar.exclusions=node_modules/**,*.md

# If you had test scripts or coverage (for Bash it's less common)
# sonar.tests=tests
# sonar.coverage.exclusions=**/*.sh

# End of configuration
